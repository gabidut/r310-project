name: Front CI (Lint & Security)

on:
  push:
    paths:
      - "front/**"
      - ".github/workflows/front-ci.yml"
  pull_request:
    paths:
      - "front/**"
      - ".github/workflows/front-ci.yml"

defaults:
  run:
    working-directory: front

jobs:
  lint:
    name: Lint HTML, CSS & JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            npm install --no-save htmlhint stylelint stylelint-config-standard eslint @eslint/js globals
          fi

      - name: Lint HTML
        run: npx htmlhint "**/*.html"

      - name: Lint CSS
        run: |
          if [ -f .stylelintrc.json ] || [ -f stylelint.config.js ] || [ -f stylelint.config.mjs ]; then
            npx stylelint "**/*.css" --allow-empty-input
          else
            npx stylelint "**/*.css" --allow-empty-input --config <(echo '{"extends": "stylelint-config-standard"}')
          fi

      - name: Lint JS
        run: |
          if [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            npx eslint "**/*.js" --no-warn-ignored
          else
            cat << 'EOF' > /tmp/eslint.config.mjs
          import js from "@eslint/js";
          import globals from "globals";
          export default [
            js.configs.recommended,
            { languageOptions: { globals: { ...globals.browser } } }
          ];
          EOF
            npx eslint "**/*.js" --no-warn-ignored --config /tmp/eslint.config.mjs
          fi

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan secrets & misconfigurations (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "front"
          scanners: "vuln,secret,misconfig"
          exit-code: "1"
          severity: "HIGH,CRITICAL"